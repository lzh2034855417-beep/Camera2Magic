name: Check experimental callback fix

on:
  push:
    branches: [fix/camerax-buffer-callback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and compile
        run: bash ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --no-configuration-cache --console=plain
